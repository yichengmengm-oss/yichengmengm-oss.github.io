<header class="site-header">
  <nav class="site-nav">
    <a href="{{ .Site.Home.RelPermalink }}" class="nav-home">{{ .Site.Params.author }}</a>
    <ul class="nav-links">
      {{ $current := . }}
      {{ range .Site.Menus.main }}
      <li><a href="{{ .URL }}" class="{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }}active{{ end }}">{{ .Name }}</a></li>
      {{ end }}
    </ul>
  </nav>
</header>
